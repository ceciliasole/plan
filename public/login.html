<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ingresar · impactese</title><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/core.css">
<style>.box{max-width:460px;margin:12vh auto 0}#msg{margin-top:14px}</style>
<div class="wrap"><div class="box"><div class="top"><span>Programa anual</span><span>impactese</span></div>
<h1>Un año para planificar bien</h1>
<p class="lead">Ingresá con la cuenta de Google del mail con el que te inscribiste.</p>
<div class="card"><div id="g"></div>
<form id="dev" hidden class="row" style="margin-top:12px"><input id="devmail" type="email" placeholder="mail (solo modo desarrollo)" required><button class="p">Entrar</button></form>
<p id="msg" class="note" hidden role="alert"></p></div></div></div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const msg=t=>{const m=document.getElementById('msg');m.textContent=t;m.hidden=!t};
async function go(path,body){
  const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(r.ok)return location.href='/app';
  msg(j.error==='not_paid'?'No encontramos una inscripción activa para '+j.email+'. Si pagaste con otro mail, escribinos y lo vinculamos.':'No pudimos validar tu cuenta de Google. Probá de nuevo.');
}
(async()=>{
  const c=await (await fetch('/api/config')).json();
  if(c.devLogin){const f=document.getElementById('dev');f.hidden=false;f.onsubmit=e=>{e.preventDefault();go('/api/dev-login',{email:devmail.value})}}
  if(!c.googleClientId){ if(!c.devLogin)msg('Falta configurar GOOGLE_CLIENT_ID en el servidor.'); return }
  const t=setInterval(()=>{if(!window.google?.accounts)return;clearInterval(t);
    google.accounts.id.initialize({client_id:c.googleClientId,callback:r=>go('/api/login',{credential:r.credential})});
    google.accounts.id.renderButton(document.getElementById('g'),{theme:'outline',size:'large',text:'signin_with',locale:'es'})},100);
})();
</script>
