<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tu plan</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/core.css">
<style>ol.list{list-style:none;padding:0;margin:22px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:12px}
.c{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:6px}
.c h2{font-size:18px}.c p{margin:0;color:var(--muted);font-size:14px;flex:1}.m{font:12px var(--f-m);color:var(--red);text-transform:uppercase;letter-spacing:.06em}
.go{align-self:flex-start;font-weight:600;color:var(--blue);border-bottom:2px solid var(--red)}
.who{display:flex;align-items:center;gap:12px}.who img{height:44px;max-width:160px;object-fit:contain}</style>
<header class="mast"><div><img class="g" src="/static/marca/guarani-blanco.png" alt="Guaraní Agency"><span class="div"></span><img class="i" src="/static/marca/impactese-blanco.png" alt="impactese"><span class="t">Plan estratégico</span></div></header>
<div class="wrap"><div class="top"><span id="mail"></span><span><a href="/onboarding" id="orglink" hidden>Datos de la organización</a> <a href="#" id="out">Salir</a></span></div>
<div class="who" style="margin-top:14px"><img id="logo" alt="" hidden><h1 id="org" style="margin:0"></h1></div>
<div class="row" id="orgbar" style="margin-top:12px" hidden><label class="f">Organización<select id="orgsel"></select></label><button type="button" class="g" id="addorg">Agregar organización</button><button type="button" class="g" id="invite">Invitar a alguien</button><span class="sub" id="orgmsg" role="status"></span></div>
<div id="pay" class="note" role="status" hidden></div><p class="lead" id="prog"></p><ol class="list" id="list"></ol></div>
<script>
const DESC={prioridades:'Qué hacer ya, qué planificar, qué delegar y qué dejar ir.',bcg:'Qué programas invertir, sostener, cosechar o cerrar.',pestel:'Cómo te afecta el contexto político, económico, social, tecnológico, ambiental y legal.',stakeholders:'A quién dedicarle tiempo, según poder e interés.',identidad:'Tu propósito, misión, visión o manifiesto, y el enunciado que guía lo que decís.',matriz:'Dónde estás frente a tus alternativas reales y dónde hay espacio.',finanzas:'Reservas, dependencia, fondos asegurados y peso de la estructura.',digital:'Qué es tuyo, qué depende de una persona y qué está expuesto.',roi:'Cuánto valor social genera cada peso, con su rango de fragilidad.',okr:'Objetivos, resultados clave, responsables y cronograma.',presupuesto:'Caja mes a mes y los baches que hay que cubrir.',plan:'Todo junto, con riesgos y los primeros 90 días.'};
const L={todo:'Sin empezar',started:'En curso',done:'Terminado'},K={todo:'',started:'warn',done:'good'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
(async()=>{
  const [me,pr,cfg]=await Promise.all([fetch('/api/me').then(r=>r.json()),fetch('/api/progress').then(r=>r.json()),fetch('/api/config').then(r=>r.json())]);
  mail.textContent=me.email;org.textContent=me.paid?me.org.name:'Plan estratégico';orglink.hidden=!me.paid;
  if(!me.paid){pay.hidden=false;pay.innerHTML='<b>Estás en modo vista previa.</b> Podés recorrer las 12 herramientas para ver qué hace cada una, pero no se pueden completar ni guardar hasta que actives tu inscripción: '+(cfg.payUrl?'<a href="'+esc(cfg.payUrl)+'">inscribite acá</a>.':'escribinos a <a href="mailto:'+esc(cfg.contact)+'">'+esc(cfg.contact)+'</a>.')}
  if(me.paid&&me.org.logo){logo.src=me.org.logo;logo.hidden=false}
  if(me.paid){
    const o=await fetch('/api/orgs').then(r=>r.json());orgbar.hidden=false;
    orgsel.innerHTML=o.orgs.map(g=>'<option value="'+esc(g.id)+'"'+(g.id===o.active?' selected':'')+'>'+esc(g.name)+'</option>').join('');
    orgsel.parentElement.hidden=o.orgs.length<2;
    orgsel.onchange=async()=>{await fetch('/api/orgs/active',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:orgsel.value})});location.reload()};
    addorg.onclick=async()=>{const d=prompt('Dominio de la organización donde vas a trabajar (por ejemplo fundacion.org)');if(!d)return;
      const r=await fetch('/api/orgs',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({domain:d})}),j=await r.json();
      if(r.ok)location.href='/onboarding';else orgmsg.textContent=j.error||'No se pudo agregar.'};
    invite.onclick=async()=>{const m=prompt('Mail de la persona que va a trabajar en esta organización (por ejemplo, tu consultora)');if(!m)return;
      const r=await fetch('/api/org/members',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:m})}),j=await r.json();
      orgmsg.textContent=r.ok?'Listo: '+m+' ya puede entrar a esta organización.':(j.error||'No se pudo invitar.')};
  }
  const d=pr.filter(p=>p.status==='done').length;
  prog.textContent=me.paid?d+' de 12 pasos terminados. Podés empezar por cualquiera; el orden sugerido va de lo que decidís primero a lo que se apoya en eso.':'Doce herramientas para armar tu plan. El orden sugerido va de lo que decidís primero a lo que se apoya en eso.';
  list.innerHTML=pr.map(p=>'<li class="c"><span class="m">Paso '+p.mes+'</span><h2>'+esc(p.name)+'</h2><p>'+esc(DESC[p.id]||'')+'</p><div class="row"><a class="go" href="/tools/'+p.id+'">'+(!me.paid?'Ver cómo funciona':p.status==='todo'?'Empezar':'Continuar')+'</a>'+(me.paid?'<span class="chip '+K[p.status]+'">'+L[p.status]+'</span>':'<span class="chip">Bloqueada</span>')+'</div></li>').join('');
  out.onclick=async e=>{e.preventDefault();await fetch('/api/logout',{method:'POST'});location.href='/'};
})();
</script>
