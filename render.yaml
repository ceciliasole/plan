services:
  - type: web
    name: plan
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        value: 16452573143-esaiagt97hncce91qcqelbi24skm8n3g.apps.googleusercontent.com
      - key: DATABASE_URL
        sync: false
